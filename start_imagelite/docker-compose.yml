services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imagelite
    ports:
      - "5432:5432"
    volumes:
      - ../imagelitedb/data:/var/lib/postgresql/data
    networks:
      - imagelitenetwork  

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    depends_on:
      - db
    networks:
      - imagelitenetwork  

  sbootapp:
    build:
      dockerfile: Dockerfile
      context: ../imageliteapi
    container_name: imageliteapi
    restart: on-failure  
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - imagelitenetwork  
    environment:
      - "POSTGRES_HOST=db"   

  app:
    build:
      dockerfile: Dockerfile
      context: ../imagelite
    container_name: imageliteapp
    restart: on-failure  
    depends_on:
      - sbootapp
    ports:
      - "3000:3000"
    networks:
      - imagelitenetwork
    expose:
      - 3000



networks:
  imagelitenetwork:
    driver: bridge     